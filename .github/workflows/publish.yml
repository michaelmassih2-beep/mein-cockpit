name: Cockpit und Nachrichten bereitstellen
on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '17 */3 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Dateien abrufen
        uses: actions/checkout@v4
      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Aktuelle Nachrichten abrufen
        run: python scripts/update_news.py
      - name: Basisfunktionen überprüfen
        run: |
          node --check site/cockpit-plus.js
          test -s site/index.html
          python -c "import json; d=json.load(open('site/news.json',encoding='utf-8')); assert all(isinstance(d.get('categories',{}).get(k),list) and len(d['categories'][k]) > 0 for k in ('world','ai','stocks'))"
      - name: GitHub Pages einrichten
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Website vorbereiten
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Website veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
